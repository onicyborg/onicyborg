    </linearGradient>
    <clipPath id="bounds"><rect x="0.5" y="0.5" width="839" height="239" rx="12" /></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="239" rx="12" fill="url(#surface)" stroke="#293744" />
  <g clip-path="url(#bounds)">
