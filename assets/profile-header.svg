<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Akhmad Fauzi / onicyborg</title>
  <desc id="description">A graphite banner with cyan API routing paths, representing a focus on backend development.</desc>
  <style>
